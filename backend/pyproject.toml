[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
]
ignore = [
    "E501",  # line too long (handled by black)
    "E402",  # Module level import not at top of file
    "E722",  # Do not use bare except
    "F401",  # imported but unused (intentional re-exports in __init__.py)
    "F811",  # redefinition of unused (inline imports inside functions)
    "F841",  # Local variable assigned to but never used
    "F403",  # from module import * used
    "BLE001", # blind exception catch
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
    "S104",  # hardcoded bind all interfaces
    "ASYNC230",  # trio/anyio-specific
    "ARG001",  # unused function argument (config params)
    "ARG002",  # unused method argument
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_auth.py", "test_chat_error.py", "test_documents.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
