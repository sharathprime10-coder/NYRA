version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: nyra_postgres
    restart: always
    environment:
      POSTGRES_USER: nyra_user
      POSTGRES_PASSWORD: nyra_password
      POSTGRES_DB: nyra_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nyra_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
