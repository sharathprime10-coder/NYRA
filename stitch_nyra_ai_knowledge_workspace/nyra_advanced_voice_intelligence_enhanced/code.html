<style>
        .glass-panel {
            background: rgba(17, 19, 29, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .glass-panel-elevated {
            background: rgba(17, 19, 29, 0.6);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(99, 102, 241, 0.15);
        }

        .pulse-ring {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .pulse-ring-slow {
            animation: pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.5); opacity: 0; }
            100% { transform: scale(1); opacity: 0; }
        }

        .gradient-text {
            background: linear-gradient(135deg, #c0c1ff 0%, #2fd9f4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .ambient-glow {
            position: absolute;
            width: 150vw;
            height: 150vh;
            top: -25vh;
            left: -25vw;
            background: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.05) 0%, rgba(17, 19, 29, 0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        .wave-anim-calm {
            animation: waveCalm 8s ease-in-out infinite alternate;
        }
        .wave-anim-dynamic {
            animation: waveDynamic 4s ease-in-out infinite alternate;
        }
        .mesh-anim-reactive {
            animation: meshReactive 2s ease-in-out infinite alternate;
        }

        @keyframes waveCalm {
            0% { transform: scale(1) translateY(0); opacity: 0.6; filter: hue-rotate(0deg); }
            100% { transform: scale(1.02) translateY(5px); opacity: 0.8; filter: hue-rotate(15deg); }
        }
        @keyframes waveDynamic {
            0% { transform: scale(1) translateY(0); opacity: 0.7; filter: hue-rotate(0deg); }
            100% { transform: scale(1.05) translateY(-10px); opacity: 1; filter: hue-rotate(30deg); }
        }
        @keyframes meshReactive {
            0% { transform: scale(1) rotate(0deg); opacity: 0.5; filter: hue-rotate(0deg); }
            100% { transform: scale(1.03) rotate(1deg); opacity: 0.9; filter: hue-rotate(-15deg); }
        }

        .persona-card {
            background: rgba(30, 31, 42, 0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(192, 193, 255, 0.1);
            transition: all 0.3s ease;
        }
        .persona-card:hover {
            background: rgba(30, 31, 42, 0.8);
            border-color: rgba(192, 193, 255, 0.3);
            transform: translateY(-2px);
        }
        .persona-card.selected {
            background: rgba(87, 27, 193, 0.2);
            border-color: #2fd9f4;
            box-shadow: 0 0 15px rgba(47, 217, 244, 0.2);
        }
        .persona-card.selected::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(135deg, #2fd9f4, transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
    </style>

<script>
        const aiWaveContainer = document.getElementById('ai-waveform-container');
        const userWaveContainer = document.getElementById('user-waveform-container');
        const aiWaveImg = document.getElementById('ai-waveform-img');
        const statusText = document.getElementById('status-text');
        const actionLabel = document.getElementById('action-label');
        const pulse1 = document.getElementById('pulse-1');
        const pulse2 = document.getElementById('pulse-2');
        
        let state = 'processing'; // 'listening', 'processing', 'speaking'

        setInterval(() => {
            // Cycle states: listening -> processing -> speaking
            if (state === 'listening') {
                state = 'processing';
                
                aiWaveContainer.classList.replace('opacity-30', 'opacity-70');
                userWaveContainer.classList.replace('opacity-80', 'opacity-30');
                
                aiWaveImg.classList.replace('wave-anim-calm', 'wave-anim-dynamic');
                
                statusText.textContent = 'Processing';
                actionLabel.textContent = 'Processing';
                
                pulse1.classList.replace('pulse-ring-slow', 'pulse-ring');
                pulse2.classList.replace('pulse-ring-slow', 'pulse-ring');

            } else if (state === 'processing') {
                state = 'speaking';
                
                aiWaveContainer.classList.replace('opacity-70', 'opacity-90');
                userWaveContainer.classList.replace('opacity-30', 'opacity-20');
                
                statusText.textContent = 'Speaking';
                actionLabel.textContent = 'Speaking';
                
            } else {
                state = 'listening';
                
                aiWaveContainer.classList.replace('opacity-90', 'opacity-30');
                aiWaveContainer.classList.replace('opacity-70', 'opacity-30'); // Fallback
                userWaveContainer.classList.replace('opacity-20', 'opacity-80');
                userWaveContainer.classList.replace('opacity-30', 'opacity-80'); // Fallback
                
                aiWaveImg.classList.replace('wave-anim-dynamic', 'wave-anim-calm');
                
                statusText.textContent = 'Listening';
                actionLabel.textContent = 'Listening';
                
                pulse1.classList.replace('pulse-ring', 'pulse-ring-slow');
                pulse2.classList.replace('pulse-ring', 'pulse-ring-slow');
            }
        }, 4000);

        // Mock Persona Selection
        const personaCards = document.querySelectorAll('.persona-card');
        personaCards.forEach(card => {
            card.addEventListener('click', () => {
                personaCards.forEach(c => {
                    c.classList.remove('selected');
                    const icon = c.querySelector('div:first-child');
                    icon.className = 'w-10 h-10 rounded-full bg-surface-container-high border border-outline-variant/30 flex items-center justify-center text-primary font-bold';
                });
                card.classList.add('selected');
                const selectedIcon = card.querySelector('div:first-child');
                selectedIcon.className = 'w-10 h-10 rounded-full bg-gradient-to-br from-primary to-secondary-container flex items-center justify-center text-on-primary font-bold';
            });
        });
    </script>
